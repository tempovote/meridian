name: Meridian
options:
  bundleIdPrefix: dev.meridian
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic

packages:
  WorkspaceUI: { path: Packages/WorkspaceUI }
  SearchKit: { path: Packages/SearchKit }
  FileKit: { path: Packages/FileKit }
  PluginHost: { path: Packages/PluginHost }
  SettingsKit: { path: Packages/SettingsKit }
  EditorUI: { path: Packages/EditorUI }
  DocumentCore: { path: Packages/DocumentCore }
  ThemeKit: { path: Packages/ThemeKit }
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.7.0"

targets:
  Meridian:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        OTHER_CODE_SIGN_FLAGS: "--deep"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
    dependencies:
      - package: WorkspaceUI
      - package: SearchKit
      - package: FileKit
      - package: PluginHost
      - package: SettingsKit
      - package: EditorUI
      - package: DocumentCore
      - package: ThemeKit
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Deep Sign Embedded Frameworks
        script: |
          APP="$TARGET_BUILD_DIR/$PRODUCT_NAME.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          ID="${CODE_SIGN_IDENTITY:--}"
          if [ -d "$SPARKLE" ]; then
            echo "Signing Sparkle nested components inside-out with identity $ID"
            [ -d "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" ] && /usr/bin/codesign --force -s "$ID" "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" || true
            [ -d "$SPARKLE/Versions/B/XPCServices/Installer.xpc" ] && /usr/bin/codesign --force -s "$ID" "$SPARKLE/Versions/B/XPCServices/Installer.xpc" || true
            [ -d "$SPARKLE/Versions/B/Updater.app" ] && /usr/bin/codesign --force -s "$ID" "$SPARKLE/Versions/B/Updater.app" || true
            [ -f "$SPARKLE/Versions/B/Autoupdate" ] && /usr/bin/codesign --force -s "$ID" "$SPARKLE/Versions/B/Autoupdate" || true
            /usr/bin/codesign --force -s "$ID" "$SPARKLE" || true
          fi
          if [ -d "$APP/Contents/MacOS" ]; then
            find "$APP/Contents/MacOS" -type f -exec /usr/bin/codesign --force -s "$ID" {} \; || true
          fi
          /usr/bin/codesign --force --deep -s "$ID" "$APP" || true
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: Meridian
        CFBundleDisplayName: Meridian
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        # Sparkle auto-update configuration.
        # Feed URL points to raw appcast.xml in main branch (returns HTTP 200).
        SUFeedURL: "https://raw.githubusercontent.com/tempovote/meridian/main/docs/appcast.xml"
        # EdDSA public key generated by Sparkle's generate_keys tool.
        # The matching private key is stored in the developer's macOS Keychain.
        SUPublicEDKey: "93zY63ZDfWHzjkUufFUVLHGvpFY9tVw6URz8qAji5ak="
        # Disable automatic background update checks on launch so Sparkle never
        # pops up update permission prompts during UI tests or app startup.
        # Manual checks via Meridian -> Check for Updates... remain fully functional.
        SUEnableAutomaticChecks: false
        # Required for sandboxed apps: tells Sparkle to use its XPC
        # installer-launcher service instead of direct process spawning.
        SUEnableInstallerLauncherService: true
        # public.text is the true common ancestor for essentially every
        # text-based system UTI (verified via `lsregister -dump`): plain
        # source files conform to it via public.plain-text, but several of
        # M4 Phase 2's grammar-bundled languages have a macOS-provided UTI
        # (public.yaml, public.toml, public.css, public.html, public.xml,
        # com.microsoft.typescript, ...) that conforms directly to
        # public.text as a SIBLING of public.plain-text, not a descendant
        # of it — so declaring only public.plain-text (as this app did
        # through M3/M4 Phase 1) left the Open panel refusing those files
        # even though SyntaxKit fully supports the grammar. Declaring
        # public.text directly covers every text-conforming UTI on the
        # system, present or future, without hand-maintaining an
        # extension list in sync with EditorUI's languageID(forFileExtension:).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text
            LSItemContentTypes: [public.text]
            CFBundleTypeRole: Editor
            NSDocumentClass: Meridian.MeridianDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: JSON
            LSItemContentTypes: [public.json]
            CFBundleTypeRole: Editor
            NSDocumentClass: Meridian.MeridianDocument
            LSHandlerRank: Alternate
          # Bare .ts resolves system-wide to public.mpeg-2-transport-stream
          # (MPEG video, predates TypeScript's extension) rather than
          # com.microsoft.typescript, so it does NOT conform to public.text
          # no matter what UTI we declare — verified via
          # UTType(filenameExtension: "ts").conforms(to: .text) == false.
          # .tsx has no such collision. Legacy extension-based matching
          # (independent of UTI conformance) is the standard remedy.
          - CFBundleTypeName: TypeScript
            CFBundleTypeExtensions: [ts]
            CFBundleTypeRole: Editor
            NSDocumentClass: Meridian.MeridianDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: Source Code
            LSItemContentTypes: [dev.meridian.source-code]
            CFBundleTypeRole: Editor
            NSDocumentClass: Meridian.MeridianDocument
            LSHandlerRank: Alternate
        # public.text alone isn't sufficient: a handful of extensions have
        # NO macOS-provided UTI at all (verified via
        # UTType(filenameExtension:) resolving to an unclaimed dyn.* type
        # that conforms to nothing) — currently cjs, rs, go on this
        # machine, though the exact set can vary by macOS version. Declare
        # a fallback UTI conforming to public.text (NOT public.plain-text —
        # see the CFBundleDocumentTypes comment above for why that was
        # wrong) covering every extension EditorUI's
        # languageID(forFileExtension:) recognizes, so an extension losing
        # its system UTI on some other machine/OS version doesn't silently
        # regress into unopenable again.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.meridian.source-code
            UTTypeDescription: Source Code
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension:
                [
                  js, mjs, cjs, ts, tsx, html, htm, css, py, yml, yaml, toml,
                  sh, bash, c, h, cpp, cc, hpp, cxx, rs, go, java, rb, php,
                  md, markdown, xml,
                ]
    entitlements:
      path: App/Resources/Meridian.entitlements
      properties:
        # Off deliberately: the App Sandbox and `GitService` are mutually
        # exclusive, which was only discovered by measurement (2026-07-28).
        # Two independent blockers, both verified in a running build:
        #
        #  1. `/usr/bin/git` is Apple's `xcrun` shim, and `xcrun` refuses to
        #     run inside a sandbox at all — every invocation came back
        #     "xcrun: error: cannot be used within an App Sandbox", status 1.
        #     Pointing `Process` at a real git binary does clear this one.
        #  2. Which then exposes the blocker that cannot be cleared: the file
        #     access an open panel grants belongs to the *app* process, and a
        #     spawned child inherits only the static sandbox profile, not
        #     those dynamic grants. So git ran and still reported "fatal: not
        #     a git repository" for a file inside this very repo, whether the
        #     user had opened the file or the enclosing folder.
        #
        # The gutter therefore never worked from the day it shipped; the
        # solid green bar it drew was `diffStatus`'s "treat every line as
        # added" fallback masking total failure. Sandboxing would mean
        # dropping the feature (or reimplementing git object reading
        # in-process). Meridian ships as a Developer ID-signed, notarized
        # DMG, which requires the Hardened Runtime but not the sandbox; only
        # Mac App Store distribution is given up here.
        com.apple.security.app-sandbox: false
        # Below are no-ops without the sandbox. Kept so the set stays intact
        # if it is ever turned back on.
        com.apple.security.files.user-selected.read-write: true
        # Outgoing network connections: required for Sparkle to download
        # the appcast feed and update packages from GitHub Releases.
        com.apple.security.network.client: true
        # Hardened Runtime (enabled below via ENABLE_HARDENED_RUNTIME)
        # enforces library validation: a loaded dylib/framework must be
        # signed with the same identity as the main executable. Ad-hoc
        # signing (no paid Developer ID yet — see M5.1) gives every binary
        # a distinct per-binary identity even when each individually reports
        # "TeamIdentifier=not set", so the ad-hoc-signed, vendored
        # Sparkle.framework fails validation and the app dies at launch
        # with a DYLD "Library not loaded ... different Team IDs" abort —
        # confirmed via crash log (2026-08-05), first local Release build.
        # Same reason MeridianUITests' entitlements already carry this key.
        # Safe to drop once the app ships Developer ID-signed and notarized.
        com.apple.security.cs.disable-library-validation: true
        # Sparkle 2 XPC services run as separate processes. The app must
        # be allowed to talk to these Mach services by name so the
        # sandbox doesn't kill the IPC channels on installation.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - dev.meridian.Meridian-spks
          - dev.meridian.Meridian-spki

  # MeridianUITests requires ad-hoc signing for `xcodebuild test` (via
  # CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES).
  # An unsigned test runner is killed by Gatekeeper on launch.
  MeridianUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: Tests/UITests/MeridianUITests.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      - target: Meridian

  MeridianPerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/PerformanceTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Meridian

  MeridianProcessPerfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ProcessPerfTests
      - Tests/PerformanceTests/PerfCorpus.swift
    settings:
      GENERATE_INFOPLIST_FILE: YES
      # Deliberately NOT hosted in Meridian.app. These tests spawn the app
      # as a subprocess; running inside the sandboxed host makes that spawn
      # crash in libsecinit_appsandbox. No `dependencies:` entry on the app
      # target either — that is what makes XcodeGen set TEST_HOST.
      TEST_HOST: ""
      BUNDLE_LOADER: ""

schemes:
  Meridian:
    build:
      targets:
        Meridian: all
        MeridianUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MeridianUITests]

  MeridianPerformanceTests:
    build:
      targets:
        Meridian: all
        MeridianPerformanceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MeridianPerformanceTests]

  MeridianProcessPerfTests:
    build:
      targets:
        Meridian: all
        MeridianProcessPerfTests: [test]
    run:
      config: Release
    test:
      config: Release
      targets: [MeridianProcessPerfTests]

